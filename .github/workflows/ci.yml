name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  DEVELOPER_DIR: /Applications/Xcode.app/Contents/Developer
  SWIFT_SYNTAX_VERSION: "603.0.2"
  SWIFT_SYNTAX_REVISION: "79e4b74a295b6eb74a8b585e3a39d29e70c1dbd1"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compiler-free-tests:
    name: Compiler-free tests (${{ matrix.channel }})
    runs-on: xcode-27
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - channel: snapshot-6.4-2026-09-04
            selector: 6.4.x-snapshot-2026-09-04
            bundle: swift-6.4.x-DEVELOPMENT-SNAPSHOT-2026-09-04-a
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Verify stable SwiftSyntax resolution
        run: |
          scripts/verify-resolved-revision.sh \
            Package.resolved \
            swift-syntax \
            "$SWIFT_SYNTAX_REVISION" \
            "$SWIFT_SYNTAX_VERSION"

      - name: Install Swiftly
        run: |
          /usr/bin/curl --fail --location --proto '=https' --tlsv1.2 \
            --output "$RUNNER_TEMP/swiftly.pkg" \
            https://download.swift.org/swiftly/darwin/swiftly.pkg
          signature_report=$(/usr/sbin/pkgutil \
            --check-signature \
            "$RUNNER_TEMP/swiftly.pkg" 2>&1)
          printf '%s\n' "$signature_report"
          if ! /usr/bin/grep -Fq \
            'Developer ID Installer: Swift Open Source (V9AUD2URP3)' \
            <<< "$signature_report"; then
            echo "Swiftly installer signer is not Swift Open Source" >&2
            exit 1
          fi
          if ! /usr/bin/grep -Fq \
            'Notarization: trusted by the Apple notary service' \
            <<< "$signature_report"; then
            echo "Swiftly installer is not trusted by Apple notarization" >&2
            exit 1
          fi
          /usr/sbin/installer \
            -pkg "$RUNNER_TEMP/swiftly.pkg" \
            -target CurrentUserHomeDirectory
          "$HOME/.swiftly/bin/swiftly" init \
            --skip-install \
            --assume-yes \
            --quiet-shell-followup

      - name: Install selected Swift toolchain
        working-directory: ${{ runner.temp }}
        run: |
          "$HOME/.swiftly/bin/swiftly" install \
            "${{ matrix.selector }}" \
            --use \
            --verify \
            --assume-yes
          toolchain_root="$HOME/Library/Developer/Toolchains/${{ matrix.bundle }}.xctoolchain"
          toolchain_plist="$toolchain_root/Info.plist"
          if [[ ! -f "$toolchain_plist" ]]; then
            echo "Expected toolchain metadata is missing: $toolchain_plist" >&2
            exit 1
          fi
          toolchain_identifier=$(/usr/libexec/PlistBuddy \
            -c 'Print :CFBundleIdentifier' \
            "$toolchain_plist")
          echo "SWIFT_MOJO_CI_TOOLCHAIN=$toolchain_identifier" >> "$GITHUB_ENV"
          echo "SWIFT_MOJO_CI_SWIFT=$toolchain_root/usr/bin/swift" >> "$GITHUB_ENV"
          echo "SWIFT_MOJO_CI_SWIFTC=$toolchain_root/usr/bin/swiftc" >> "$GITHUB_ENV"
          echo "SWIFT_MOJO_CI_SCRATCH=$RUNNER_TEMP/swift-mojo-${{ matrix.channel }}" >> "$GITHUB_ENV"

      - name: Record toolchain
        run: |
          if [[ ! -x "$SWIFT_MOJO_CI_SWIFT" \
            || ! -x "$SWIFT_MOJO_CI_SWIFTC" ]]; then
            echo "Selected Swift toolchain executables are missing" >&2
            exit 1
          fi
          "$SWIFT_MOJO_CI_SWIFT" --version
          xcode_version=$(/usr/bin/xcodebuild -version)
          printf '%s\n' "$xcode_version"
          if [[ "$xcode_version" != $'Xcode 27.0\nBuild version 27A5252f' ]]; then
            echo "CI requires Xcode 27.0 build 27A5252f for the qualified SDK baseline" >&2
            exit 1
          fi

      - name: Confirm Mojo is absent
        run: |
          if command -v mojo >/dev/null 2>&1; then
            echo "Mojo must not be installed in compiler-free CI" >&2
            exit 1
          fi

      - name: Run static test-safety guards
        run: |
          scripts/test-generic-boundary.sh
          scripts/check-generic-boundary.sh
          scripts/check-sync-shutdown-in-deinit.sh Sources Tests

      - name: Rehearse exact-version consumer in an isolated Git remote
        run: |
          TOOLCHAINS="$SWIFT_MOJO_CI_TOOLCHAIN" scripts/release-pretag-semver-gate.sh \
            "$GITHUB_WORKSPACE" \
            999.0.0 \
            999.0.0 \
            "$(git rev-parse HEAD)"

      - name: Build tests with the selected compiler
        run: |
          scripts/command-timeout.sh 900 -- \
            env -u SWIFT_MOJO_EXECUTABLE TOOLCHAINS="$SWIFT_MOJO_CI_TOOLCHAIN" \
              /usr/bin/xcrun swift build \
              --build-system swiftbuild --build-tests \
              --scratch-path "$SWIFT_MOJO_CI_SCRATCH"

      - name: Run bounded runtime tests
        run: |
          scripts/swift-test-hang-guard.sh \
            --repeats 1 --timeout 120 -- \
            env -u SWIFT_MOJO_EXECUTABLE TOOLCHAINS="$SWIFT_MOJO_CI_TOOLCHAIN" \
              /usr/bin/xcrun swift test \
              --build-system swiftbuild --skip-build --no-parallel \
              --filter 'MojoRuntimeWorkerTests|MojoRuntimeTests|MojoRuntimeWorkerPOSIXTests' \
              --scratch-path "$SWIFT_MOJO_CI_SCRATCH"

      - name: Run bounded remaining tests
        run: |
          scripts/swift-test-hang-guard.sh \
            --repeats 1 --timeout 120 -- \
            env -u SWIFT_MOJO_EXECUTABLE TOOLCHAINS="$SWIFT_MOJO_CI_TOOLCHAIN" \
              /usr/bin/xcrun swift test \
              --build-system swiftbuild --skip-build --no-parallel \
              --skip 'MojoRuntimeWorkerTests|MojoRuntimeTests|MojoRuntimeWorkerPOSIXTests' \
              --scratch-path "$SWIFT_MOJO_CI_SCRATCH"

      - name: Verify external package boundaries
        run: |
          TOOLCHAINS="$SWIFT_MOJO_CI_TOOLCHAIN" scripts/test-public-package-boundary.sh
